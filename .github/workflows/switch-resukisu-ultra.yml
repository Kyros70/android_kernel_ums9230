name: Switch to ReSukiSU

on:
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Swap submodule to ReSukiSU
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [ -d "KernelSU-Next" ]; then
            git submodule deinit -f KernelSU-Next
            git rm -f KernelSU-Next
            rm -rf .git/modules/KernelSU-Next
          fi

          git submodule add -b main https://github.com/ReSukiSU/ReSukiSU.git KernelSU-Next

      - name: Commit submodule swap
        run: |
          git add .gitmodules KernelSU-Next
          git commit -m "Switch KernelSU-Next submodule to ReSukiSU" || echo "No changes to commit"
          git push
